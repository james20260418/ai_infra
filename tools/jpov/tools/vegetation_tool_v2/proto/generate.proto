// 植物「生成配置」—— 喂给 Blender/Sapling 的那组参数，落成可 diff、可 review 的文件。
//
// 这个文件是**输入**（怎么长一棵树），不是资产格式。资产格式见 ./shape.proto。
//
// 为什么要 proto 化：
//   * 现在这些参数是靠一长串 `--set k=v` 命令行传的，改一个数就是改一次性命令，
//     没有历史、没有注释、没法 review，过两周没人记得 `baseSize=0.35` 是想干嘛。
//   * 参数含义是**非直觉**的（`baseSize` 不是树的尺寸而是「第一根侧枝出现的高度比例」），
//     必须和代码放在一起写清楚，否则每个人都要把 Sapling 源码翻一遍。
//   * 同一棵树要能**一字不差**地重放（seed + 全部参数 → 同一份 shape）。
//
// 字段命名约定（重要）：
//   `SaplingTree` 里的字段名**逐字对应 Sapling Tree Gen 插件的 operator 属性名**
//   （Blender 4.0.2 `bpy.ops.curve.tree_add` 的 RNA），不做 snake_case 化。
//   这样 python 工具到 Sapling 是机械映射，不需要维护「我的名字 ↔ 它的名字」对照表；
//   那张表一旦漂移，生成结果会静默变样（不报错，只是树不一样了）。
//   查属性全表：`bpy.ops.curve.tree_add.get_rna_type().properties`。
//
// 语义约定：
//   * **未写 = 用预设自带的值**（不是 0！）。写了 `0` 就是真的设 0，两者含义不同。
//     工具靠「字段在文件里出现过没有」区分，pbtxt 天然保留了这一点。
//   * 标注「度」的角度字段，Sapling 内部会转成弧度（`toRad`），文件里一律写**度**。
//   * 「无量纲乘数」的世界尺寸 = 该乘数 × `scale`（米），只是近似，别当精确几何公式。
//
// 未覆盖的参数用 `extra_set` 逃生口传（见下），不要为了一个冷门参数就改本 schema。
//
// 一棵树是分两步"长"出来的，本文件同时对这两步下参数：
//   1. 建骨架（`tree`）：由 Blender 的 Sapling 插件生成。这一步得到的是**数学树** ——
//      等半径的圆管、光滑的贝塞尔轴、同一级的枝按同一套角度分布，整齐但不真实。
//   2. 弄不规整（`noise`）：我们自己的后处理，给每根枝加尺寸抖动和弯度。
//      Sapling 没有这个能力，也不该有：它负责"长什么形状"，这里负责"有多不齐"。
//   噪声的结果会直接烘进 shape 资产，所以 shape.proto 里没有噪声参数（详见 `ShapeNoise`）。

syntax = "proto2";

package jpov.vegetation;

// 一份完整的生成配置。
message VegetationGenerateConfig {
  // 配置版本。当前 = 1。
  // 改字段**语义/单位**才需要升版本（加字段不用，proto 天然向后兼容）。
  optional uint32 version = 1;

  // 名字，只用于日志与默认产物名（例如 "oak" → oak.pbtxt）。不参与生成。
  optional string name = 2;

  // 自然人可读的说明：这是什么树、想让它长成什么样、为什么这么调。
  // 给人 / 给 agent 看，**永不参与逻辑判断**。
  optional string description = 3;

  // 建树（Blender + Sapling Tree Gen）。
  optional SaplingTree tree = 4;

  // 导出成 ShapeProto 时的采样/叶卡约定。
  optional ShapeExport export = 5;

  // 枝条的不规整（尺寸抖动、纵向/横向弯度）。
  // 整块省略 = 全部关闭 = 与没有这一层的旧资产逐字节一致。
  optional ShapeNoise noise = 6;
}

// Sapling Tree Gen 的建树参数。
//
// 索引约定：`length / branches / curveRes / downAngle ...` 这类长度 4 的数组，
// 下标 = **枝级**（0 = 主干，1 = 一级侧枝，2 = 二级，3 = 三级）。
// 与 `levels` 配合：`levels=3` 只用到下标 0..2，后面写了也不生效。
//
// 角度字段单位一律是**度**；Sapling 内部转弧度。
message SaplingTree {
  // Sapling 的树种预设名。决定「没写的字段」从哪儿继承。
  //
  // 取值（Blender 4.0.2 自带 9 个）：
  //   callistemon  douglas_fir  japanese_maple  quaking_aspen  small_maple
  //   small_pine   weeping_willow  white_birch  willow
  //
  // 预设文件在 `<blender>/scripts/addons/add_curve_sapling/presets/<name>.py`，
  // 是一个裸 dict，可以直接读出来看每个字段的初值。
  optional string preset = 1;

  // 逃生口：直接透传给 Sapling 的 `k=v`，绕过下面的强类型字段。
  // 只给「本 schema 没覆盖的冷门参数」用；能用强类型字段就别用它。
  // 同名 key 以本字段为准（后写覆盖先写）。
  repeated string extra_set = 2;

  // ---- 整体 -----------------------------------------------------------------

  // 整棵树的尺寸。世界单位（米）量级：主干长度 ≈ length[0] × scale。
  // 只影响大小，不影响比例（比例由各角/长度乘数决定）。
  // Sapling 默认 13。做单棵展示树常用 8~14。
  optional float scale = 3;

  // 随机种子。**同 seed + 同参数 = 同一棵树**（逐字节可复现）。
  // 换 seed 是「换一棵同风格的树」，不是「改风格」。
  optional int32 seed = 4;

  // 分枝级数：1 = 只有主干，2 = 主干 + 一级枝，3 = 再加二级，4 = 再加三级。
  // 每加一级，枝数和文件体积大致 ×(branches 的均值)，**这是最贵的旋钮**。
  // Sapling 默认 3。
  optional int32 levels = 5;

  // ---- 冠形包络 -------------------------------------------------------------
  // 冠形决定「各级枝的长度沿树干如何分布」，也就是整体轮廓（塔形 / 球形 / 圆柱…）。
  //
  // 取值（Sapling 的 shape 枚举，写整数 id）：
  //   0  = Conical                    圆锥（上小下大）
  //   1  = Spherical                  球形冠（阔叶树的通用起点）
  //   2  = Hemispherical              半球（灌木/矮冠）
  //   3  = Cylindrical                圆柱
  //   4  = Tapered Cylindrical        收细圆柱
  //   5  = Flame                      火焰形（下宽上尖，中间鼓）
  //   6  = Inverse Conical            倒圆锥（上大下小，少用）
  //   7  = Tend Flame                 趋火焰形（多数针叶树预设用它）
  //   8  = Custom Shape               自定义，参数看 customShape
  //   10 = Inverse Tapered Cylindrical 倒收细圆柱
  // Sapling 默认 7。
  optional int32 shape = 6;

  // 同上，但作用在「单干的分枝上」（Sapling 的 shapeS）。
  // 只在部分预设里有意义；不确定就别写。
  optional int32 shapeS = 7;

  // `shape=8`（Custom Shape）时使用的自定义曲线，4 个归一化控制值（0..1 量级）：
  //   [下段宽度, 上段宽度, 上段起点, 下段收窄]
  // 只有 shape=8 时生效。
  repeated float customShape = 8;

  // 每级侧枝数量（下标 = 枝级；下标 0 通常写 0，主干不分枝）。
  // 例：`0,30,13,7` = 主干不分、30 根一级、每根 13 个二级、每根 7 个三级。
  // 枝数 ≈ 30 × 13 × 7 量级，**最容易造成分钟级生成时间的字段**。
  repeated int32 branches = 9;

  // 每级枝的曲线分辨率（每段贝塞尔的分段数），影响骨骼采样点密度。
  // 大 → 弯枝更顺、文件更大；小 → 折线感。
  // 例：`10,6,4,1`。
  repeated int32 curveRes = 10;

  // 每级枝的长度乘数（无量纲；世界长度 ≈ 该值 × scale）。
  // 下标 0 是主干长度，1 起是各级侧枝相对长度。
  // 例：`0.6,0.8,0.6,0.4` = 主干 0.6·scale，一级枝 0.8·scale…
  repeated float length = 11;

  // 每级枝长的随机浮动比例（0..1，略小于 1 更自然；0 = 全部等长，很假）。
  repeated float lengthV = 12;

  // ---- 枝条弯曲 -------------------------------------------------------------
  // 每级枝的弯曲角度（**度**，可负 = 反向弯）。正值让枝梢朝一侧勾。
  repeated float curve = 13;

  // 每级弯曲的随机幅度（度）。让同一级的枝不整齐划一。
  repeated float curveV = 14;

  // 每级枝的「反曲」（**度**）：往回弯，做垂枝/拱形用。
  repeated float curveBack = 15;

  // ---- 分枝角度 -------------------------------------------------------------
  // 子枝相对父枝的下垂角（**度**）。0 = 顺着父枝往上，90 = 垂直于父枝（水平），
  // >90 = 下垂。灌木/伞状树把它调大，塔形针叶树保持预设值。
  repeated float downAngle = 16;

  // 上述下垂角的随机幅度（**度**）。
  repeated float downAngleV = 17;

  // 子枝绕父枝的周向旋转角（**度**）。决定侧枝在圆周上的分布（错开会长得均匀）。
  repeated float rotate = 18;

  // 周向旋转的随机幅度（**度**）。
  repeated float rotateV = 19;

  // 一级分裂角（**度**）：枝自身分叉时两杈的张角。
  repeated float splitAngle = 20;

  // 分裂角的随机幅度（**度**）。
  repeated float splitAngleV = 21;

  // 每级枝「再分裂出子枝」的比例（0..1，每段枝都可能分裂）。
  // 调大 → 更密、更乱、更慢。
  repeated float segSplits = 22;

  // 基部分裂数：从树干底部同时长出的主干数（0 = 单干）。
  // 灌木/丛生树用它（配 `baseSize` 很小），乔木保持 0 或 1。
  optional int32 baseSplits = 23;

  // **第一根侧枝出现的高度占主干的比例**（0..1）。**不是树的尺寸！**
  //   0.2  = 下部 20% 光杆，上面全是枝（乔木）
  //   0.05 = 几乎从地面开始分枝（灌木）
  //   >1   = 所有枝挤到树顶（会得到一根「蜡烛」，新手最常踩的坑）
  // Sapling 默认 0.4。
  optional float baseSize = 24;

  // 基部分裂（baseSplits）那几根干的分叉高度比例（0..1）。
  optional float baseSize_s = 25;

  // 分裂发生的位置（0..1，沿枝的参数位置）。
  optional float splitHeight = 26;

  // 分裂在树干上的偏向（-1..1）：往根部聚 or 往梢部聚。
  optional float splitBias = 27;

  // true = 按长度决定是否分裂（长的枝更容易分），false = 按数量。
  optional bool splitByLen = 28;

  // 子枝周向排布模式：
  //   "rotate"   = 按 rotate 角度递增（螺旋，最整齐，预设默认）
  //   "original" = 沿用父枝的朝向
  //   "random"   = 完全随机（最自然，但同一 seed 下也可能偏冠）
  optional string rMode = 29;

  // ---- 吸引（把枝往某个方向拉，是"树形手感"的主要来源之一） --------------------
  // 向上吸引：正值把枝往上拉（塔形/直立），负值往下压（垂枝/开展）。
  // 单位无量纲（0..2 量级），逐级给。
  repeated float attractUp = 30;

  // 向外吸引：正值把枝往外推（冠幅变宽），负值收缩。
  repeated float attractOut = 31;

  // 枝间距系数：侧枝沿父枝的分布疏密（1 = 预设值，>1 更稀）。
  optional float branchDist = 32;

  // 树冠整体收细：>0 让冠部（细枝）相对根部变细，做"头轻脚重"的观感。
  optional float taperCrown = 33;

  // ---- 半径（粗细） ---------------------------------------------------------
  // 树干底部半径 / 主干长度（无量纲）。0.01 = 细高，0.02 = 常规，0.04+ = 粗壮古树。
  // Sapling 默认 0.015。
  optional float ratio = 34;

  // 半径随高度的衰减指数：越大，越往上越细（常见 1.2~1.5）。
  optional float ratioPower = 35;

  // 每级枝的收细系数（逐级相乘）。
  repeated float taper = 36;

  // 每级半径的额外微调倍数（1 = 不调）。
  repeated float radiusTweak = 37;

  // 半径下限（米）：防止末梢细到看不见/退化。
  optional float minRadius = 38;

  // 根部外扩倍数（1 = 不外扩，1.3 = 明显板根）。
  optional float rootFlare = 39;

  // 枝梢是否收口（true = 封顶）。
  optional bool closeTip = 40;

  // 是否自动按长度收细半径（一般保持 true，手动 radiusTweak 时才关）。
  optional bool autoTaper = 41;

  // ---- 叶卡 -----------------------------------------------------------------
  // 每根末级枝的叶片**上限**（不是精确数量：实际受枝长/密度限制）。
  // 负值 = 另一种沿枝分布算法（Sapling 的 "negative leaves"，做垂枝/藤状用）。
  // 实测参考：`leaves=55` 对 12m 松树够密；`200` 对 7m 阔叶树才有体积感。
  optional int32 leaves = 42;

  // 叶片在树上的分布包络（0..10，取值同 shape 的枚举）。一般沿用预设。
  optional int32 leafDist = 43;

  // 叶卡尺寸（相对树尺度，无量纲）。0.17 ≈ 预设默认；针叶树调小、阔叶树调大。
  optional float leafScale = 44;

  // 叶卡尺寸的随机浮动比例（0..1）。>0 才有层次感，0 = 全部一样大很假。
  optional float leafScaleV = 45;

  // 叶卡沿枝的尺寸渐变（负值向下变小，正值向上变小）。
  optional float leafScaleT = 46;

  // 叶卡的下垂角（**度**）：0 = 顺着枝，90 = 平展。
  optional float leafDownAngle = 47;

  // 下垂角的随机幅度（**度**）。
  optional float leafDownAngleV = 48;

  // 叶卡绕枝的旋转角（**度**，黄金角 137.5 是常见值）。
  optional float leafRotate = 49;

  // 上述旋转角的随机幅度（**度**）。
  optional float leafRotateV = 50;

  // true = 叶卡保持水平（避免穿帮），false = 跟随枝的朝向。
  optional bool horzLeaves = 51;

  // 每根枝的横截面环数提示（0 = 用预设/由曲线分辨率决定）。
  optional int32 nrings = 52;
}

// 枝条的不规整 —— 尺寸抖动、纵向弯度、横向弯度。
//
// 解决什么问题：Sapling 长出来的树太"干净"。每根枝都是等截面的圆管、轴是一条光滑的
// 贝塞尔曲线、同一级的枝按同一套公式分布 —— 远看像塑料模型。真实树木里，
// 每根枝的长短粗细都不一样，中段会弓出去，从上看还会左右扭。这三件事就是下面三个参数。
//
// 参数是**按枝级**给的数组：第 0 个元素管主干，第 1 个管一级侧枝，第 2 个管二级侧枝……
// （和 `tree` 里 `length`、`curve`、`branches` 的下标含义完全一样）。
// 数组写得比实际枝级短 = 后面那几级不抖；写 0 = 明确关掉这一级。
//
// 每根枝具体抖多少，由树的种子（`tree.seed`）和这根枝自己的编号一起算出来。
// 所以同一份配置文件永远生成同一棵树；想换一棵同风格但不一样的树，改 seed 就行。
//
// **这些参数只活在生成配置里，shape 资产里没有它们**：
// 生成完就把结果写进 shape —— 每根枝的中心线位置、每个采样点的半径、每个采样点的截面形状。
// 下游（查看器 / glb 烘焙器 / 引擎）看到的是一棵已经长歪的树，不需要、也没法再算一遍噪声。
// 理由和"叶子的位置已经烘死在资产里"一样：资产要能自解释，不能依赖某份配置还在手边。
//
// **这些参数也不进查看器的面板**：面板是用来看资产长什么样的，不是用来调生成参数的。
// 想看别的形状，改配置重新生成一份 shape —— 否则预览和最终资产会变成两套真相。
//
// 施加顺序（实现时别搞反）：
//   1. 采样出每根枝的中心线和半径；
//   2. 加噪声，把这根枝弄歪；
//   3. 再决定子枝长在父枝的哪个位置、每张叶子挂在枝上哪一点。
// 反过来的话（先挂叶子再把枝弄弯），叶子会整片悬空、子枝会脱开枝条，
// 资产校验会直接拒收（`LeafCardProto.anchor` 要求叶子必须贴着所属枝条）。
//
// 为什么弯度的两端刻意保持不动：
//   * 枝根不动 ⇒ 它和父枝的连接点位置不变，不需要重新求交，接缝不会裂开；
//   * 枝梢不动 ⇒ 末梢挂着的叶子不会跟着飘到枝条外面；
//   * 中段挂着的子枝和叶子会随新的中心线一起移动 —— 这是对的，它们本来就长在这根枝上。
//
// 为什么只有"幅度"、没有波长/频率：
//   可调的参数越少，配置越不容易调坏。一根枝上只有一个大 S 就够表达"这根枝不直"；
//   想要局部的凹凸起伏，那是截面形状（profile）该做的事，不是轴线该做的事。
message ShapeNoise {
  // 尺寸抖动：这一级每根枝"整体放大/缩小"的幅度。0 = 不抖。
  //
  // 取值是倍数波动范围：写 0.15 = 每根枝随机乘上 0.85~1.15 之间的一个倍数，
  // 而且**长度和半径乘同一个倍数** —— 所以是整体变得长一点/短一点、粗一点/细一点，
  // 不是被单独拉长或压扁。写 0.3 就是 ±30%。
  //
  // 在树上看到的效果：
  //   * 同一级的枝不再一样长、一样粗；远看树冠的轮廓有起伏，不像修剪过的。
  //   * 子枝长在父枝的哪个相对位置上是不变的，所以父枝变长时子枝跟着往外挪。
  //     这意味着**第 0 个元素（主干）调大，整棵树会整体变高/变矮**，冠幅跟着放大/缩小。
  //   * 叶子的大小不跟着变（叶子大小由叶卡尺寸决定），但叶子挂的位置跟着枝走。
  //
  // 建议 0.1~0.2（一眼能看出每根枝都不一样）。超过 0.4 会开始出现不合理的枝，
  // 例如某一根短到接不上下游冠层、或者粗到和主干一样。
  repeated float size_jitter = 1;

  // 纵向弯度（bend_longitudinal）：枝的中段朝"上下/前后"方向鼓出去，让枝条不是一条直线。0 = 不弯。
  //
  // 取值是"枝长的倍数"：写 0.08 = 这根枝的中段最多偏离原来的中心线约枝长的 8%
  // （10 m 长的枝 ≈ 0.8 m），两端不动。一根枝一条 S 形，不会来回抖很多下。
  //
  // 方向对每根枝各自定义，含义是：世界竖直方向（+Y）在"垂直于这根枝"的平面上的投影。
  //   * 对竖直的主干：就是前/后方向 —— 正视图里像弓背一样拱一下，最明显。
  //   * 对水平的侧枝：就是上/下方向 —— 枝会往上翘或往下垂。
  //
  // 每根枝的 S 从哪个相位开始也不一样（同样由种子算出来），所以同一棵树上
  // 不会出现"所有枝朝同一侧鼓"的假象 —— 那种整齐感一眼就能看出是程序生成的。
  //
  // 建议：主干 0.03~0.08（轻微弓背，太大会像被风吹弯），侧枝 0.05~0.15（细枝更软）。
  repeated float bend_longitudinal = 2;

  // 横向弯度（bend_lateral）：垂直于"纵向"的那个方向 —— 从正上方看，枝条像蛇一样左右扭。0 = 不弯。
  //
  // 取值同样是"枝长的倍数"，建议 0.02~0.10。它和纵向弯度各自独立叠加，
  // 合起来是一条空间曲线（不是只在某一个平面里弯）。
  //
  // 注意：对竖直的主干，横向弯度在正视图里几乎看不出来，只有从上方看才明显。
  // 想让主干看起来不直，用的是上面那个"纵向弯度"；这个管的是树冠的侧向不整齐
  // （从上方看冠形不是一个规整的圆）。
  repeated float bend_lateral = 3;
}

// 从 Sapling 曲线导出成 ShapeProto 时的采样与叶卡约定。
message ShapeExport {
  // 每段贝塞尔曲线的采样点数（`per_seg`）。
  //   6  = 骨架较省（范本 willow 用的值），弯枝略有折线感
  //   8  = 通用
  //   16 = 很顺，文件线性变大
  // 注意这**不是** Sapling 的 curveRes：curveRes 决定骨架本身有几段，
  // per_seg 决定每段再切成几个采样点。两者相乘才是最终采样点数。
  optional uint32 per_seg = 1;

  // 叶卡宽 / 高（无量纲）。写进每张卡的 `width = height × leaf_aspect`。
  // 配合素材的格子比例：细长叶 0.35~0.5，阔叶 0.7~1.0。
  optional double leaf_aspect = 2;

  // 叶卡素材的根部画在格子的哪个角（决定 UV 锚点，见资产格式 §4.1）：
  //   "bottom_left" / "bottom_center" / "bottom_right" / "top_center"
  // 素材怎么画就写哪个，导出侧不做任何补偿性偏移。
  optional string anchor_mode = 3;

  // leaf type 的自然语言描述（"柳树叶簇，细长披针形"），写进 shape.pbtxt 供人/agent 读。
  optional string leaf_type_desc = 4;

  // 叶面弯曲：叶子不是平板，而是微微弯的曲面。下面三个数都是「卡高的倍数」
  // （12cm 的叶子写 0.15 = 1.8cm 的位移），不写 = 0 = 平板卡（与旧资产一致）。
  // 精确的曲面定义见 shape.proto 的 LeafBendProto；这里只是同一个东西的输入口。

  // 叶尖相对叶柄的抬起/垂下：正 = 叶尖翘起，负 = 叶尖垂下去。下垂叶给负、直立叶给 0~0.15。
  optional double leaf_bend_along = 5;

  // 叶面卷成浅杯：正 = 两侧叶缘卷起来（中间凹），负 = 两侧叶缘往下翻。阔叶 0.08~0.2，针叶给 0。
  optional double leaf_bend_across = 6;

  // 中脉的折痕：正 = 中脉比两侧高（像沿中脉折过一道），负 = 一道浅沟。0.1~0.2 就明显。
  optional double leaf_bend_crease = 7;

  // 每级枝的**环顶点数**：绕枝条截面一圈用几个顶点画这个"圆"。
  // 下标 = 枝级（0 = 主干，1 = 一级侧枝……），最后一项重复用到更深的级。
  // 不写 = 用默认 16、12、8（主干 16、一级 12、其余 8）。
  //
  // 它决定的是**圆滑程度**，不是粗细（粗细是 `tree.ratio` / 半径）：
  //   * 16 / 12：正圆，凑近也看不出棱角；
  //   * 8：远看仍是圆的，凑到眼前能数出八条边；
  //   * 4：细枝够用（一根细枝在屏幕上往往只有几个像素），粗枝能明显看出方管；
  //   * 3：极低配，细枝能看出三棱 —— 只建议给"末级细枝"用。
  //
  // 为什么要按级给：顶点数几乎全花在细枝上。把末三级从 8 降到 4，
  // 一棵 4100 根枝的杉树能省一半以上顶点，而粗枝仍保持圆的观感。
  //
  // ⚠️ 顶点数的另一大半在叶卡上（每张弯曲卡 9 个顶点），调环数不要指望包治百病；
  //    真要压预算，先减叶片数量（`tree.leaves`），再降环数。
  repeated uint32 ring_count = 8;
}

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # apt 网络抖动防护：Ubuntu 软件源（archive.ubuntu.com 等）近期间歇不稳定
      # （8/17-8/19 持续 warning/down），apt-get 无超时会长期挂起阻塞 CI。
      # 分两步：update 只下小索引（紧超时，快速探路/失败重试）；install 装包
      # （松超时，防大文件被误杀）。历史实测成功 run 的 install 最慢 ~97s
      # （test 小包）/ ~96s（MinGW），故 update=30s、install=120s 留足余量。
      # http::Timeout 是"单个连接卡死"超时，传输推进中不计时，不影响慢下载。
      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxrender-dev

      - name: Install Bazelisk
        run: |
          curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64"
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel

      - name: Build (Linux)
        run: bazel build //...

      - name: Setup Xvfb
        run: |
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=60 xvfb
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Test (Linux)
        run: bazel test //...
        env:
          DISPLAY: :99

  windows-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64"
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 -o Acquire::http::Timeout=180 -o Acquire::https::Timeout=180 g++-mingw-w64-x86-64

      - name: Build (Windows cross-compile)
        run: |
          bazel build //demo/... //tools/jpov:jpov_demo.exe --config=windows

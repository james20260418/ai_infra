name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:    # 手动触发（force-push 后 CI 未自动触发时使用）

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxrender-dev

      - name: Install Bazelisk
        run: |
          curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64"
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel

      # --experimental_repository_disable_download：禁掉所有 @repo 的联网下载。
      # 第三方包全部来自 third_party/distdir/（见 docs/jpov_environment.md §4）。
      # 加这个 flag 是把「断网可构建」变成 CI 的受检属性：谁加了新的 http_archive
      # 却没把 tarball 放进 distdir，这里立刻红，而不是等真断网那天才发现。
      - name: Verify offline deps (distdir)
        run: python3 third_party/distdir/verify.py

      - name: Build (Linux, offline deps)
        run: bazel build //... --experimental_repository_disable_download

      - name: Setup Xvfb
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Test (Linux, offline deps)
        run: bazel test //... --experimental_repository_disable_download
        env:
          DISPLAY: :99

  windows-build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64"
          chmod +x bazelisk-linux-amd64
          sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel

      - name: Install MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Build (Windows cross-compile, offline deps)
        # 每个交互式 viewer 都有 .exe 变体（build_<viewer>.sh --windows 编的就是它）。
        # 全列在这里，免得某个 viewer 的 Windows 链路（MinGW 宏冲突 / 缺符号）烂掉
        # 却没人发现 —— 这类问题在 Linux 侧一次都不会暴露。
        # 同样禁网络：Windows 链路用的 rules_cc / zlib 等也必须从 distdir 取。
        run: |
          bazel build --config=windows --experimental_repository_disable_download \
            //demo/... \
            //tools/jpov:jpov_demo.exe \
            //tools/jpov:jpov_skylight_viewer.exe \
            //tools/jpov:jpov_ui_demo.exe \
            //tools/jpov:jpov_sp_ui_demo.exe \
            //tools/jpov:jpov_model_viewer.exe \
            //tools/jpov:jpov_pick_highlight_viewer.exe \
            //tools/jpov:jpov_fog_viewer.exe \
            //tools/jpov:jpov_soft_mesh_viewer.exe \
            //tools/jpov:jpov_particle_viewer.exe \
            //tools/jpov:jpov_volume_fire_viewer.exe \
            //tools/jpov:jpov_strip_viewer.exe \
            //tools/jpov/demo/fbx_viewer:jpov_fbx_viewer.exe \
            //tools/jpov/tools/vegetation_tool_v2:jpov_vegetation_v2_viewer.exe

  genvolume:
    # 体积资产生成工具的 Python 单测（不参与 bazel；纯 unittest + pyopenvdb）。
    # 工具与测试：tools/jpov/genVolume/。
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: sudo apt-get update && sudo apt-get install -y python3 python3-numpy python3-openvdb python3-pil

      - name: Unit tests (genVolume)
        run: python3 -m unittest discover -s tools/jpov/genVolume -p 'test_*.py' -v
